# Builds the site with Eleventy and publishes it to GitHub Pages
# every time something is uploaded to the main branch.
#
# Security notes:
# - Every step is one of GitHub's own official actions, locked to an exact
#   commit fingerprint (the long code after @). The version is in the comment.
#   Even if someone tampered with an action later, this build keeps using the
#   copy checked on 15 Oct 2026. Dependabot proposes updates when new versions
#   are released.
# - "npm ci --ignore-scripts" installs the exact versions in package-lock.json
#   and refuses to run any install-time scripts from the downloaded packages.
# - Each job gets only the permissions it needs.
name: Build and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

permissions: {}        # nothing by default; each job asks for what it needs

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
