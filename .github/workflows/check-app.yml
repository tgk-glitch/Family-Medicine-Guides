# Private app repository: checks every upload. It does NOT publish anything.
# Publishing is done by Cloudflare Pages, behind Cloudflare Access (sign-in required).
#
# Security notes (same rules as the public site):
# - Only GitHub's official actions, each locked to an exact commit fingerprint.
# - "npm ci --ignore-scripts": exact versions from package-lock.json, no install scripts.
# - Read-only permissions; no secrets are used.
name: Check app build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Public site still builds
        run: npm run build
      - name: Private app builds
        run: rm -rf _site && npm run build:app
      - name: App checks (security policy, offline list, links)
        run: npm run app:check
